# fly.toml app configuration file generated for tacvector on 2026-11-26T01:42:42-06:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tacvector'
primary_region = 'lax'

[build]

[env]
  DB_PATH = '/data/tacvector.db'

[mounts]
  source = 'tacvector_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
